# UhHu! gates de CI — D-11/D-12/D-13 fail-closed.
#
# 6 jobs, todos fail-closed: qualquer falha quebra o pipeline. A unica via de
# excecao e o aceite formal datado em .planning/aceites-seguranca.md (D-13).
# Branch protection em `main` deve exigir este workflow verde (passo manual no
# checkpoint 01-03: Settings > Branches). Nenhum gate pode ser silenciosamente
# afrouxado: supressao sem aceite e tratada como sabotagem (T-03-04/T-03-06).

name: gates

on: [push, pull_request]

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format
      - run: pnpm test

  secrets-tree:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: gitleaks/gitleaks-action@v2
        with:
          args: detect --source . --no-git -v --config .gitleaks.toml

  secrets-history:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: gitleaks/gitleaks-action@v2
        with:
          args: detect --source . -v --config .gitleaks.toml

  sast:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: docker run --rm -v ${{ github.workspace }}:/src:ro returntocorp/opengrep:latest opengrep scan --config auto /src/apps /src/packages

  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level high

  integration-pg:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: uhhu_test
          POSTGRES_USER: uhhu_test
          POSTGRES_PASSWORD: uhhu_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U uhhu_test -d uhhu_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      APP_DATABASE_URL: postgresql://uhhu_test:uhhu_test_password@127.0.0.1:5432/uhhu_test
      MIGRATION_DATABASE_URL: postgresql://uhhu_test:uhhu_test_password@127.0.0.1:5432/uhhu_test
      PORT: '3000'
      LOG_LEVEL: info
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @uhhu/db db:migrate
      - run: |
          pnpm --filter @uhhu/core-api start > /tmp/core-api.log 2>&1 &
          echo $! > /tmp/core-api.pid
          for i in $(seq 1 30); do
            if curl --fail http://127.0.0.1:3000/health; then
              break
            fi
            sleep 2
          done
          curl --fail http://127.0.0.1:3000/health
      - run: pnpm test:integration
      - run: kill $(cat /tmp/core-api.pid) || true
